name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release-Tag, z. B. v0.4.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    secrets: inherit
