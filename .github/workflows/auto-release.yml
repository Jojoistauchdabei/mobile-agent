name: auto-release
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  prepare:
    # Eigene Release-Commits duerfen keinen neuen Release ausloesen (Loop-Schutz).
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Git-Identitaet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release vorbereiten
        id: prep
        run: scripts/prepare-release.sh --apply
      - name: Release-Commit und Tag pushen
        if: steps.prep.outputs.created == 'true'
        run: |
          git push origin main
          git push origin "${{ steps.prep.outputs.tag }}"

  # Der Tag-Push loest bewusst keinen eigenen Workflow aus (Pushes mit
  # GITHUB_TOKEN starten keine Actions). Deshalb wird der Release hier direkt
  # als aufrufbarer Workflow gestartet.
  publish:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
